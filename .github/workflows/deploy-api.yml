name: Deploy API

# Called from ci.yml after ci-ok passes on main; can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for Workload Identity Federation (no stored keys)

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: tripforge-api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tripforge/tripforge-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --image="$IMAGE" \
            --service-account="tripforge-run@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated --ingress=all \
            --port=3000 --cpu=1 --memory=512Mi --concurrency=80 \
            --min-instances=0 --max-instances=2 --cpu-throttling --cpu-boost \
            --startup-probe=httpGet.path=/health,initialDelaySeconds=0,periodSeconds=5,failureThreshold=24,timeoutSeconds=3 \
            --set-env-vars="NODE_ENV=production,LOG_LEVEL=info,TRUST_PROXY_HOPS=${{ vars.TRUST_PROXY_HOPS }},CORS_ORIGIN=${{ vars.CORS_ORIGIN }}" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest" \
            --quiet

      - name: Smoke test /health
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --max-time 60 "$URL/health"
