name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      deploy-api: ${{ steps.filter.outputs.deploy-api }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.dockerignore'
              - 'shared/**'
              - 'package-lock.json'
            deploy-api:
              - 'server/**'
              - '.dockerignore'
              - 'shared/**'
              - 'package*.json'
              - '.github/workflows/deploy-api.yml'
            client:
              - 'client/**'
              - 'shared/**'
              - 'package-lock.json'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same credentials as server/.env.test, which the tests read.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tripforge
          POSTGRES_PASSWORD: tripforge
          POSTGRES_DB: tripforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tripforge:tripforge@localhost:5432/tripforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint server shared
      - run: npm run typecheck -w @tripforge/shared -w @tripforge/server
      - run: npm run db:deploy -w @tripforge/server
      - run: npm test -w @tripforge/server
      - run: npm run build -w @tripforge/server
      - name: Build production image
        run: docker build -f server/Dockerfile -t tripforge-api:ci .

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint client shared
      - run: npm run typecheck -w @tripforge/shared -w @tripforge/client
      - run: npm test -w @tripforge/client
      - run: npm run build -w @tripforge/client

  ci-ok:
    if: always()
    needs: [changes, server, client]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."

  # Backend CD: deploy to Cloud Run after every required check passed on main (backend-spec §15).
  deploy-api:
    needs: [changes, ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy-api == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
