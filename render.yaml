# Render Blueprint for the TripForge API (backend-spec.md §14).
# Secrets marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: tripforge-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: '4'
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
